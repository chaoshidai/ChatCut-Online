name: 功能建议
description: 描述希望解决的创作问题和使用场景
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 请描述当前为什么难以完成，而不只是写功能名称。
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      placeholder: 素材类型、视频长度、发布平台、使用频率等
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望结果
      description: 完成后用户应当能做到什么？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 当前替代方式
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，没有发现相同建议。
          required: true
        - label: 内容不含账号、支付、凭据或私人素材。
          required: true

