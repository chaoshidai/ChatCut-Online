name: Bug 报告
description: 报告可重复的客户端、编辑、生成或导出问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先删除手机号、订单、验证码、Token、私人素材和完整本地路径。安全漏洞请使用 Security 私密报告。
  - type: input
    id: version
    attributes:
      label: ChatCut Online 版本
      placeholder: 例如 1.0.0，可在关于或安装包中查看
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: 操作系统与硬件
      placeholder: 例如 Windows 11 24H2、x64、NVIDIA RTX 4060
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 问题类型
      options:
        - 启动或安装
        - 登录或网络
        - 工程或素材导入
        - 时间线或预览
        - Agent
        - AI 生成
        - 导出
        - 更新
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 最短复现步骤
      description: 请按 1、2、3 列出从启动客户端开始的操作。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏证据
      description: 可附截图、错误文字、任务 ID/Trace ID 或诊断包链接。请再次检查隐私。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，没有发现相同问题。
          required: true
        - label: 我已删除账号、支付、凭据、私人素材和完整本地路径等敏感信息。
          required: true
        - label: 这不是需要私密处理的安全漏洞。
          required: true

